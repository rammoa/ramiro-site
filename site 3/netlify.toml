# Netlify configuration
# Static files live at the repo root; the checkout function lives in netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

# Nicer URLs (optional): /portfolio -> portfolio.html, etc.
[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
